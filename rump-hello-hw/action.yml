name: 'RumpRun Hello World Hardware'
description: |
  The rumprun hello-world test on hardware.
author: Gerwin Klein <gerwin.klein@proofcraft.systems>

inputs:
  name:
    description: Comma separated list of build names to filter build list on.
    required: false
  req:
    description: Comma separated list of hardware to build for.
    required: false
  mode:
    description: Comma separated list of modes to build for. One of `{32, 64}.`
    required: false
  index:
    description: job index in matrix build
    required: true
  start_delay:
    description: |
      Maximum delay in seconds before the hardware run starts. The real delay at
      runtime is uniformly random in the interval `[0, start_delay]` to stagger
      board start-up times. Set to 0 to disable.
    required: false
    default: '60'
  action_name:
    description: 'internal -- do not use'
    required: false
    default: 'rump-hello-hw'

runs:
  using: 'node24'
  main: '../js/index.js'
  post: '../js/post.js'
